apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: app-virtualservice
spec:
  hosts:
  - "app.ankur.com"
  gateways:
  - shared-gateway
  http:
  - route:
    - destination:
        host: restapi-service
        subset: v1
      weight: 80  # 80% traffic to v1
    - destination:
        host: restapi-service
        subset: v2
      weight: 20  # 20% traffic to v2
